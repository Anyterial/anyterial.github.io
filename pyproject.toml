[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anyterial-portal"
version = "0.1.0"
description = "Anyterial portal static site generated with httk-serve."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "Rickard Armiento", email = "rickard-gpg@armiento.net" }]
dependencies = [
  "httk-serve @ git+https://github.com/httk/httk-serve@main",
]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]

[tool.setuptools]
py-modules = []
